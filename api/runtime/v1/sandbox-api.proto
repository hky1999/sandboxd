syntax = "proto3";

package runtime.v1;

option go_package = "github.com/inclusionAI/sandboxd/api/runtime/v1;v1";

// SandboxService manages sandbox lifecycle and inspection operations.
service SandboxService {
  // Start creates and starts a sandbox.
  rpc Start(StartRequest) returns (StartResponse) {}
  // Creates at most once under a durable operation identity. Never fall back
  // to Start when this RPC is unsupported or its outcome is unknown.
  rpc StartOperation(StartOperationRequest) returns (StartOperationResponse) {}
  // Reads durable historical results. UNKNOWN is not proof of non-creation;
  // STARTED is not a claim that the original incarnation is currently alive.
  rpc GetStartOperation(GetStartOperationRequest) returns (StartOperationResponse) {}
  // Reclaim closed history only. This response never proves physical retirement.
  rpc CollectHistory(CollectHistoryRequest) returns (CollectHistoryResponse) {}
  // Checkpoint saves a running sandbox and stops its source process.
  rpc Checkpoint(CheckpointRequest) returns (CheckpointResponse) {}
  // Checkpoints only the physical incarnation identified by the nested
  // request's source sandbox and expected_generation. Fails on old servers
  // instead of silently ignoring the generation precondition.
  rpc CheckpointIfGeneration(CheckpointIfGenerationRequest) returns (CheckpointResponse) {}
  // Pause freezes all tasks in a running sandbox without terminating it.
  // The sandbox keeps its identity, network, and control-plane linkage;
  // Resume unfreezes it. This is the short-window parking primitive that
  // preserves broker-level records (unlike Checkpoint, whose source
  // termination is observed by the broker as sandbox death).
  rpc Pause(PauseRequest) returns (PauseResponse) {}
  // Resume unfreezes a previously paused sandbox.
  rpc Resume(PauseRequest) returns (PauseResponse) {}
  // Restore restores either a legacy local checkpoint or a verified,
  // deterministic resume attempt and returns authoritative physical facts.
  rpc Restore(RestoreRequest) returns (StartResponse) {}
  // DeleteCheckpoint deletes one exact sandboxd-owned checkpoint artifact.
  rpc DeleteCheckpoint(DeleteCheckpointRequest) returns (DeleteCheckpointResponse) {}
  // Delete force-deletes a sandbox.
  rpc Delete(DeleteRequest) returns (DeleteResponse) {}
  // Fails on old servers instead of silently ignoring a generation precondition.
  rpc DeleteIfGeneration(DeleteIfGenerationRequest) returns (DeleteIfGenerationResponse) {}
  // Wait waits for a sandbox to exit.
  rpc Wait(WaitRequest) returns (WaitResponse) {}
  // List lists sandboxes by filters.
  rpc List(ListSandboxesRequest) returns (ListSandboxesResponse) {}
  // Stats returns resource usage statistics for a sandbox.
  rpc Stats(StatsRequest) returns (StatsResponse) {}
  // Apply a scheduler-approved monotonic increase with incarnation and limit checks.
  rpc ResizeResources(ResizeResourcesRequest) returns (ResizeResourcesResponse) {}
  // Apply a scheduler-approved memory decrease for one incarnation. The CPU
  // numbers must equal the live limits; the daemon freezes the sandbox's host
  // cgroup for the write window and never changes the scheduler lifecycle.
  rpc ShrinkResources(ShrinkResourcesRequest) returns (ResizeResourcesResponse) {}
  // Reconcile an original command without performing resource writes.
  // An unstarted command can be durably fenced only after its original expiry.
  rpc ResolveResourceOperation(ResolveResourceOperationRequest) returns (ResizeResourcesResponse) {}
  // ListAvailableRuntimes lists runtime classes whose handlers are ready.
  rpc ListAvailableRuntimes(ListAvailableRuntimesRequest) returns (ListAvailableRuntimesResponse) {}
  // SetNetworkPolicy atomically replaces the network policy of a running sandbox.
  rpc SetNetworkPolicy(SetNetworkPolicyRequest) returns (SetNetworkPolicyResponse) {}
}

message StartOperationRequest {
  StartRequest start = 1;
  string operation_id = 2;
  // Opaque full-request SHA256 supplied by the caller. The daemon separately
  // hashes the complete nested protobuf request to detect changed payloads.
  string request_fingerprint = 3;
  uint64 deadline_unix_millis = 4;
  HistoryIdentity history_identity = 5;
}

message GetStartOperationRequest {
  string operation_id = 1;
  string request_fingerprint = 2;
  uint64 deadline_unix_millis = 3;
  // Explicitly fence a never-admitted operation after its deadline. A healthy
  // admission index and authoritative physical checks are required. Callers
  // must not enable this for operations sent through legacy Start.
  bool seal_missing = 4;
  HistoryIdentity history_identity = 5;
}

enum StartOperationState {
  START_OPERATION_STATE_UNKNOWN = 0;
  START_OPERATION_STATE_PENDING = 1;
  START_OPERATION_STATE_STARTED = 2;
  // Durable rejection before physical side effects; later identical requests
  // replay this outcome and cannot dispatch a creation.
  START_OPERATION_STATE_NOT_CREATED = 3;
  // Only a matching completed generation-conditional retirement receipt
  // authorizes this outcome. Absence alone never authorizes it.
  START_OPERATION_STATE_RETIRED = 4;
}

message StartOperationResponse {
  string operation_id = 1;
  string request_fingerprint = 2;
  uint64 deadline_unix_millis = 3;
  StartOperationState state = 4;
  // Original bound sandbox ID and generation, including for PENDING/RETIRED.
  // A successful result also retains its original IP and ports.
  StartResponse result = 5;
}

// NetworkPolicyAction is the action selected by a network policy rule.
enum NetworkPolicyAction {
  NETWORK_POLICY_ACTION_UNSPECIFIED = 0;
  NETWORK_POLICY_ACTION_ALLOW       = 1;
  NETWORK_POLICY_ACTION_DENY        = 2;
}

// NetworkDirection is expressed from the sandbox's point of view.
enum NetworkDirection {
  NETWORK_DIRECTION_UNSPECIFIED = 0;
  NETWORK_DIRECTION_INGRESS     = 1;
  NETWORK_DIRECTION_EGRESS      = 2;
  NETWORK_DIRECTION_BOTH        = 3;
}

// NetworkProtocol selects the IPv4 transport protocol matched by a rule.
enum NetworkProtocol {
  NETWORK_PROTOCOL_UNSPECIFIED = 0;
  NETWORK_PROTOCOL_ANY         = 1;
  NETWORK_PROTOCOL_TCP         = 2;
  NETWORK_PROTOCOL_UDP         = 3;
  NETWORK_PROTOCOL_ICMP        = 4;
}

// TrafficPolicyMode selects whether replies are evaluated independently or
// are admitted from connection state created by an allowed new flow.
enum TrafficPolicyMode {
  TRAFFIC_POLICY_MODE_UNSPECIFIED = 0;
  TRAFFIC_POLICY_MODE_STATELESS   = 1;
  TRAFFIC_POLICY_MODE_STATEFUL    = 2;
}

// NetworkEndpoint identifies the remote peer matched by a traffic rule.
message NetworkEndpoint {
  // Address is an exact IPv4 address in v1.
  string address = 1;
  // Port is an exact TCP or UDP port. Zero matches any port.
  uint32 port = 2;
  // Cidr is an IPv4 address or CIDR prefix in network policy schema v2.
  string cidr = 3;
  // Domain is an exact DNS name or a leading "*." suffix pattern in schema
  // v2. Domain peers are valid only for egress rules.
  string domain = 4;
  // PortRange selects a contiguous remote TCP or UDP port range in schema v2.
  PortRange port_range = 5;
}

// TrafficRule describes one ingress or egress packet rule.
message PortRange {
  uint32 first = 1;
  uint32 last  = 2;
}

message TrafficRule {
  NetworkPolicyAction action = 1;
  NetworkDirection direction = 2;
  NetworkProtocol protocol   = 3;
  NetworkEndpoint peer       = 4;
  // SandboxPort is the destination port on ingress and source port on
  // egress. Zero matches any sandbox port. An omitted peer matches any
  // remote address and port.
  uint32 sandbox_port = 5;
  // SandboxPortRange selects an inclusive local port interval in schema v2.
  PortRange sandbox_port_range = 6;
  // Priority orders schema v2 rules. Higher values win and DENY wins a tie.
  // Zero selects the default user priority of 100.
  uint32 priority = 7;
}

// TrafficPolicy controls IPv4 packets crossing a sandbox's host veth.
message TrafficPolicy {
  NetworkPolicyAction default_action = 1;
  repeated TrafficRule rules         = 2;
  TrafficPolicyMode mode             = 3;
  // IngressDefaultAction and EgressDefaultAction are required by schema v2.
  NetworkPolicyAction ingress_default_action = 4;
  NetworkPolicyAction egress_default_action  = 5;
}

// DNSRule matches either an exact DNS name or a leading "*." suffix pattern.
message DNSRule {
  NetworkPolicyAction action = 1;
  string pattern             = 2;
}

// DNSPolicy controls conventional DNS queries sent through sandboxd's proxy.
message DNSPolicy {
  NetworkPolicyAction default_action = 1;
  repeated DNSRule rules             = 2;
}

// NetworkPolicy combines packet and DNS policy. Missing sections allow traffic.
message NetworkPolicy {
  TrafficPolicy traffic = 1;
  DNSPolicy dns         = 2;
  uint32 schema_version = 3;
}

// SetNetworkPolicyRequest replaces a running sandbox's complete policy.
message SetNetworkPolicyRequest {
  string sandbox_id            = 1;
  NetworkPolicy network_policy = 2;
}

// SetNetworkPolicyResponse is empty after a successful replacement.
message SetNetworkPolicyResponse {}

// RootfsSrcType identifies the root filesystem source type.
enum RootfsSrcType {
  S3    = 0;
  IMAGE = 1;
  LOCAL = 2;
}

// S3Config describes an S3 object source.
message S3Config {
  string endpoint          = 1;
  string bucket            = 2;
  string object            = 3;
  string access_key_id     = 4;
  string access_key_secret = 5;
}

// RootfsConfig describes the sandbox root filesystem source.
message RootfsConfig {
  // Readonly makes the root filesystem read-only when true.
  bool readonly = 1;
  // Type identifies the root filesystem source type.
  RootfsSrcType type = 2;
  oneof source {
    // ImageURL is the image URL used as the root filesystem source.
    string image_url = 3;
    // S3Config is the S3 object used as the root filesystem source.
    S3Config s3_config = 4;
    // Path is a local directory or file used as the root filesystem source.
    string path = 5;
  }
  // WritableLayerSizeBytes is a compatibility alias used by existing
  // Function Proxy clients. sandboxd normalizes it to the start request's
  // writable_layer_limit_bytes field.
  uint64 writable_layer_size_bytes = 6;
}

// Mount describes an additional mount attached to the sandbox.
message Mount {
  // Type identifies the mount type, such as bind, volume, or tmpfs.
  string type = 1;
  // Target is the mount target path inside the sandbox.
  string target = 2;
  // Options contains zero or more fstab-style mount options.
  repeated string options = 3;
  oneof source {
    // HostPath is a host path for bind mounts or a volume name.
    string host_path = 10;
    // S3Config is the S3 object used as the mount source.
    S3Config s3_config = 11;
    // ImageURL is the OCI image URL used as the mount source.
    string image_url = 12;
  }
}

// XpuAllocation describes concrete accelerator devices assigned by the
// scheduler on the selected node.
message XpuAllocation {
  // Type is the normalized accelerator type, such as gpu.
  string type = 1;
  // DeviceIDs contains node-local physical device IDs selected by the scheduler.
  repeated uint32 device_ids = 2;
}

// StartRequest describes a sandbox start request.
// CheckpointInfo references a previously published checkpoint for a
// cooperative restore during Start (upstream contract).
message CheckpointInfo {
  string checkpoint_dir = 1;
}

message StartRequest {
  // SandboxID is an optional caller-provided sandbox ID. sandboxd generates one when empty.
  string sandbox_id = 1;
  // TemplateID is reserved for API compatibility with downstream builds that
  // can start from pre-registered sandbox templates. The open-source runtime
  // path does not implement template reuse and ignores this field.
  string template_id = 2;
  // Runtime is the runtime handler name, such as runsc.
  string runtime = 3;
  // Rootfs is the root filesystem source used by the sandbox.
  RootfsConfig rootfs = 4;
  // Command is the executable and arguments to run inside the sandbox.
  repeated string command = 5;
  // Cwd is the working directory inside the sandbox.
  string cwd = 6;
  // Envs contains environment variables for the sandbox process.
  map<string, string> envs = 7;
  // Mounts contains additional mounts attached to the sandbox.
  repeated Mount mounts = 8;
  // Resources contains sandbox resource requests. CPU is millicores and memory is MB.
  map<string, double> resources = 9;
  // Stdout is the redirect path for stdout. Empty means stdout is discarded to /dev/null.
  string stdout = 10;
  // Stderr is the redirect path for stderr. Empty means stderr is discarded to /dev/null.
  string stderr = 11;
  // ExtraConfig is a JSON string for runtime-specific configuration.
  string extra_config = 12;
  // Network is reserved for network-mode selection. The current runsc adapter
  // always uses sandbox networking with netstack.
  string network = 13;
  // TraceID is an optional distributed trace ID.
  string trace_id = 14;
  // Ports contains port forwarding entries in "protocol:dstPort:targetPort" format.
  repeated string ports = 15;
  // Labels contains sandbox labels used for selection and runtime metadata.
  map<string, string> labels = 16;
  // MetricLabels contains sandbox metadata intended for metric dimensions.
  map<string, string> metric_labels = 17;
  // XpuAllocations contains concrete accelerator devices assigned to the sandbox.
  repeated XpuAllocation xpu_allocations = 18;
  // WritableLayerLimitBytes is the hard quota for the writable root filesystem
  // layer. Zero preserves the node-configured default for older clients.
  uint64 writable_layer_limit_bytes = 19;
  // NetworkPolicy is the sandbox's initial packet and DNS policy. It can be
  // replaced while the sandbox is running with SetNetworkPolicy.
  NetworkPolicy network_policy = 20;
  CheckpointInfo checkpoint_info = 21;
  string inject_entrypoint = 22;
}

// StartResponse is returned after sandbox start.
message StartResponse {
  // Code is 0 on success.
  int32 code = 1;
  // Message contains details about the start result.
  string message = 2;
  // ID is the unique sandbox ID.
  string id = 3;
  // Address assigned to the sandbox network endpoint (agent-dx upstream field).
  string sandbox_ip = 4;
  // Physical incarnation assigned by the daemon when this sandbox was created.
  string resource_generation = 5;
  // Concrete mappings; moved from 4 to 6 in the agent-dx scheduler branch.
  // This branch intentionally does not preserve the YuanRong ports-at-4 contract.
  repeated string ports = 6;
}

// CheckpointRequest preserves agent-dx upstream fields 1-6. Scheduler
// extensions start at 7; old YuanRong request numbers are not accepted here.
message CheckpointRequest {
  string id = 1;
  string checkpoint_dir = 2;
  uint32 timeout_seconds = 3;
  bool compress = 4;
  bool leave_running = 5;
  string snapshot_type = 6;
  // Immutable scheduler artifact identity.
  string checkpoint_id = 7;
  // Capture writable files at the same consistency point as memory state.
  bool include_filesystem = 8;
  string trace_id = 9;
  // Legacy internal timeout alias; new clients use timeout_seconds at 3.
  int64 timeout = 10;
}

// CheckpointResponse is returned after the checkpoint artifact is published.
message CheckpointResponse {
  bool success = 1;
  string message = 2;
  string artifact_path = 3;
  int64 artifact_size = 4;
  string artifact_sha256 = 5;
  // Physical lifetime bound to the published source manifest; empty for legacy artifacts.
  string source_generation = 6;
}

// CheckpointIfGenerationRequest checkpoints one exact physical incarnation.
message CheckpointIfGenerationRequest {
  // Checkpoint is the checkpoint command for the source sandbox.
  CheckpointRequest checkpoint = 1;
  // ExpectedGeneration must equal the source sandbox's current
  // akernel.scheduler/resource-generation value at checkpoint time.
  string expected_generation = 2;
}

// PauseRequest targets one running sandbox. Resume takes the same shape.
message PauseRequest {
  // SandboxID is the sandbox to freeze or unfreeze.
  string id = 1;
  string trace_id = 2;
}

// PauseResponse is empty once the freeze (or unfreeze) has taken effect.
message PauseResponse {}

// DeleteCheckpointRequest binds cleanup to one committed physical artifact.
message DeleteCheckpointRequest {
  string checkpoint_dir = 1;
  string checkpoint_id = 2;
  string source_sandbox_id = 3;
  int64 expected_size = 4;
  string expected_sha256 = 5;
  // Optional scheduler extension; exact physical source incarnation.
  string expected_source_generation = 6;
}

// DeleteCheckpointResponse is empty after an exact or already-complete delete.
message DeleteCheckpointResponse {}

// RestoreRequest preserves the legacy config/checkpoint_dir wire fields and
// adds the immutable identity required by deterministic cross-node resume.
message RestoreRequest {
  StartRequest config = 1;
  string checkpoint_dir = 2;
  // CheckpointID identifies the immutable logical snapshot. When set, all
  // deterministic identity fields are required.
  string checkpoint_id = 3;
  // ExpectedSHA256 binds the caller-owned artifact to SnapshotInfo.
  string expected_sha256 = 4;
  // ExpectedSize binds the caller-owned artifact to SnapshotInfo.
  int64 expected_size = 5;
}

// DeleteRequest describes a force-delete request.
message DeleteRequest {
  // ID is the sandbox ID.
  string id = 1;
  // Timeout is reserved for graceful deletion. v0.1.0 ignores it and always
  // force-deletes the sandbox.
  int64 timeout = 2;
}

// DeleteResponse is returned after sandbox delete.
message DeleteResponse {}

// WaitRequest describes a sandbox wait request.
message WaitRequest {
  // ID is the sandbox ID.
  string id = 1;
}

// WaitResponse is returned after waiting for a sandbox.
message WaitResponse {
  // Status is reserved and is 0 for a successful Wait response in v0.1.0.
  int32 status = 1;
  // ExitCode is the sandbox process exit code.
  int32 exit_code = 2;
  // Message contains details about the sandbox state.
  string message = 3;
}

// ListSandboxesRequest describes a sandbox list request.
message ListSandboxesRequest {
  // ID filters by sandbox ID when set.
  string id = 1;
  // Selector filters sandboxes by labels. Empty selector lists all sandboxes.
  map<string, string> selector = 10;
}

// ListSandboxesResponse contains sandbox list results.
message ListSandboxesResponse {
  // Sandboxes contains matching sandbox statuses.
  repeated SandboxStatus sandboxes = 1;
}

// SandboxState is the persisted lifecycle state of a sandbox.
enum SandboxState {
  reserved 3 to 5;
  reserved "SANDBOX_STATE_CHECKPOINTING";
  reserved "SANDBOX_STATE_CHECKPOINTED";
  reserved "SANDBOX_STATE_RESTORING";

  SANDBOX_STATE_RUNNING = 0;
  SANDBOX_STATE_EXITED  = 1;
  SANDBOX_STATE_UNKNOWN = 2;
}

// SandboxStatus describes the current status and metadata of a sandbox.
message SandboxStatus {
  // ID is the sandbox ID.
  string id = 1;
  // Command is the executable and arguments configured for the sandbox.
  repeated string command = 2;
  // Runtime is the runtime handler name.
  string runtime = 3;
  // State is the current sandbox lifecycle state.
  SandboxState state = 4;
  // StartedAt is the sandbox start timestamp in Unix seconds.
  int64 started_at = 5;
  // FinishedAt is the sandbox finish timestamp in Unix seconds.
  int64 finished_at = 6;
  // ExitCode is the sandbox process exit code when available.
  int32 exit_code = 7;
  // Message contains details about the sandbox state.
  string message = 8;
  // Labels contains sandbox labels.
  map<string, string> labels = 9;
  // Mounts contains additional mounts attached to the sandbox.
  repeated Mount mounts = 10;
  // Envs contains environment variables configured for the sandbox.
  repeated KeyValue envs = 11;
  // Stdout is the configured stdout redirect path.
  string stdout = 12;
  // Stderr is the configured stderr redirect path.
  string stderr = 13;
  // Resources contains Linux resource settings for the sandbox.
  LinuxSandboxResources resources = 14;
  // MetricLabels contains sandbox metadata intended for metric dimensions.
  map<string, string> metric_labels = 15;
  // Ports contains the concrete host/container mappings owned by this sandbox.
  repeated string ports = 16;
  // Ip is the sandbox's IP inside the sandboxd bridge (W18: the LLM proxy
  // sees this as the connection source after the host routes 10.88/16;
  // resolvers join it back to this sandbox). Empty when network resources
  // are absent (e.g. DisableCgroup/debug sandboxes).
  string ip = 17;
}

// KeyValue represents a string key-value pair.
message KeyValue {
  // Key is the entry key.
  string key   = 1;
  // Value is the entry value.
  string value = 2;
}

// LinuxSandboxResources describes Linux resource settings for a sandbox.
message LinuxSandboxResources {
  // CPUPeriod is the CPU CFS period in microseconds.
  uint64 cpu_period = 1;
  // CPUQuota is the CPU CFS quota in microseconds.
  int64 cpu_quota = 2;
  // CPUShares is the relative CPU share weight.
  uint64 cpu_shares = 3;
  // MemoryLimitInBytes is the memory limit in bytes.
  int64 memory_limit_in_bytes = 4;
  // OomScoreAdj is the OOM score adjustment.
  int64 oom_score_adj = 5;
  // CpusetCpus is the allowed CPU set.
  string cpuset_cpus = 6;
  // CpusetMems is the allowed memory node set.
  string cpuset_mems = 7;
  // HugepageLimits contains hugepage limits by page size.
  repeated HugepageLimit hugepage_limits = 8;
  // Unified contains cgroup v2 unified controller settings.
  map<string, string> unified = 9;
  // MemorySwapLimitInBytes is the memory plus swap limit in bytes.
  int64 memory_swap_limit_in_bytes = 10;
}

// HugepageLimit describes a hugepage limit for one page size.
message HugepageLimit {
  // PageSize is the hugepage size.
  string page_size = 1;
  // Limit is the hugepage limit in bytes.
  uint64 limit = 2;
}

// SandboxPhysicalPhase records whether a sandbox's durable physical facts are
// complete enough to publish through List/Inspect.
enum SandboxPhysicalPhase {
  // UNSPECIFIED is reserved for metadata written before physical phases were introduced.
  SANDBOX_PHYSICAL_PHASE_UNSPECIFIED = 0;
  // INTENT may own resources but is not a published physical sandbox.
  SANDBOX_PHYSICAL_PHASE_INTENT = 1;
  // COMMITTED has a materialized runtime, spec, resources, filesystem and network facts.
  SANDBOX_PHYSICAL_PHASE_COMMITTED = 2;
}

// SandboxMetadata contains the persisted metadata for a sandbox.
message SandboxMetadata {
  // ID is the sandbox ID.
  string id = 1;
  // RuntimeHandler is the runtime handler name.
  string runtime_handler = 3;
  // Labels contains sandbox labels.
  map<string, string> labels = 4;
  // Stdout is the configured stdout redirect path.
  string stdout = 6;
  // Stderr is the configured stderr redirect path.
  string stderr = 7;
  // MetricLabels contains sandbox metadata intended for metric dimensions.
  map<string, string> metric_labels = 8;
  // Ports contains the concrete host/container mappings persisted with the sandbox.
  repeated string ports = 9;
  // PhysicalPhase controls whether this physical record is publishable.
  SandboxPhysicalPhase physical_phase = 10;
  // RestoreIdentity is present only for sandboxes created by Restore.
  RestoreIdentity restore_identity = 11;
  // ResourceFacts contains sandboxd-owned cgroup, interface and other physical
  // allocations needed to clean an INTENT even before an OCI spec exists.
  map<string, string> resource_facts = 12;
}

// SandboxMetadataList contains persisted sandbox metadata entries.
message SandboxMetadataList {
  // Sandboxes maps sandbox ID to sandbox metadata.
  map<string, SandboxMetadata> sandboxes = 1;
}

// StatsRequest describes a sandbox stats request.
message StatsRequest {
  // ID is the sandbox ID.
  string id = 1;
}

// StatsResponse contains sandbox resource usage statistics.
message StatsResponse {
  // Total CPU usage in nanoseconds.
  uint64 cpu_usage_ns = 1;
  // Current memory usage in bytes.
  uint64 memory_usage_bytes = 2;
  // Memory limit in bytes.
  uint64 memory_limit_bytes = 3;
  // Maximum memory usage observed in bytes.
  uint64 memory_max_usage_bytes = 4;
  // CPU usage in kernel mode in nanoseconds.
  uint64 cpu_kernel_ns = 5;
  // CPU usage in user mode in nanoseconds.
  uint64 cpu_user_ns = 6;
  // Effective cgroup CPU quota/period in microseconds. Quota -1 is unlimited.
  // A false known flag distinguishes unsupported/missing readings from zero.
  int64 cpu_quota_usec = 7;
  uint64 cpu_period_usec = 8;
  bool cpu_limits_known = 9;

  // Server-owned physical incarnation; changes whenever an ID is recreated.
  string resource_generation = 10;
  // Persisted elastic initial/ceiling policy, empty for non-elastic sandboxes.
  string elastic_policy = 11;
  // Cumulative pressure counters for this physical generation; false means unknown.
  bool cpu_pressure_known = 12;
  uint64 cpu_periods = 13;
  uint64 cpu_throttled_periods = 14;
  uint64 cpu_throttled_ns = 15;
  bool memory_pressure_known = 16;
  uint64 memory_high_events = 17;
  uint64 memory_oom_events = 18;
  uint64 memory_oom_kill_events = 19;

  // Source validity of the matching numeric field: true only when the daemon
  // parsed the exact kernel cgroup file (cpu.stat usage_usec, memory.current,
  // memory.max, memory.peak) under strict bounded rules. False covers missing,
  // malformed, or overflowing sources and the cgroup v1 backend, which cannot
  // prove source presence; the legacy numeric fallback may still be populated,
  // so consumers must consult the flag before trusting the number. Servers
  // predating these fields default them to false for the same reason.
  bool cpu_usage_known = 20;
  bool memory_usage_known = 21;
  bool memory_limit_known = 22;
  // memory_max_usage_bytes is a measured memory.peak only when this is true;
  // otherwise the server may have substituted current usage as the legacy
  // fallback, which is not an observed peak.
  bool memory_peak_known = 23;

  // Monotonic per-incarnation resource revision. It starts at 1 when the
  // physical incarnation is created and advances by one for every accepted
  // grow/shrink operation, including partially applied ones; resource_revision
  // itself is only a proven fact when resource_revision_known is true. An
  // incarnation whose state is unknown (created before this contract, or a
  // damaged record) reports false and rejects revision-conditioned operations
  // rather than guessing an initial value.
  uint64 resource_revision = 24;
  bool resource_revision_known = 25;
  // Enforced memory.high observation. unlimited has its own flag instead of
  // masquerading as a finite 0; a false known flag means the number is unknown
  // or belongs to the cgroup v1 backend, which has no memory.high.
  uint64 memory_high_bytes = 26;
  bool memory_high_known = 27;
  bool memory_high_unlimited = 28;
  // Kernel-observed frozen state of the sandbox's host cgroup (cgroup.events
  // frozen). It is the freeze fact, not the freeze request.
  bool frozen = 29;
  bool frozen_known = 30;
  // Operation identity of the last journal-recorded resource operation for
  // this incarnation. The controller closes an UNKNOWN outcome only by
  // matching this operation_id at the post-operation revision with
  // resource_operation_pending false and correct, unfrozen limits; an equal
  // target number alone never closes it.
  string resource_operation_id = 31;
  bool resource_operation_pending = 32;
  // Absolute cgroup v2 directory behind this Stats read, proven by the
  // daemon under the same physical lock as the resource revision identity.
  // Empty when the backend cannot prove one (cgroup v1) or the incarnation's
  // revision state does not verify. It is a read-only locator for event
  // watchers; it is never a write target and never replaces the revision
  // journal's identity verification.
  string memory_cgroup_path = 33;
}

// ListAvailableRuntimesRequest requests the runtime classes currently available
// for new sandbox creation.
message ListAvailableRuntimesRequest {}

// ListAvailableRuntimesResponse contains the available runtime class snapshot.
// RuntimeInfo describes one runtime handler's capabilities.
message RuntimeInfo {
  // RuntimeClass is the handler name accepted by sandbox start requests.
  string runtime_class = 1;
  // SupportsCheckpointRestore reports whether the handler implements both operations.
  bool supports_checkpoint_restore = 2;
  // CheckpointHandoffPath is the guest-visible resume/restore/error endpoint.
  string checkpoint_handoff_path = 3;
  // RestoreEnvPath exposes the target OCI process environment after restore.
  string restore_env_path = 4;
}

message ListAvailableRuntimesResponse {
  // RuntimeClasses contains the sorted handler names accepted by sandbox start requests.
  // Configured runtime classes whose handlers failed to initialize are excluded.
  repeated string runtime_classes = 1;
  // Runtimes contains detailed capabilities in runtime_classes order.
  repeated RuntimeInfo runtimes = 2;
}

// RestoreIdentity binds a deterministic target sandbox to one exact restore request.
message RestoreIdentity {
  // CheckpointID is the opaque checkpoint artifact identity.
  string checkpoint_id = 1;
  // RequestSHA256 is the digest of the normalized logical restore request.
  string request_sha256 = 2;
}

// ResourceLimits uses kernel cgroup units and finite, positive limits only.
message ResourceLimits {
  int64 cpu_quota_usec = 1;
  uint64 cpu_period_usec = 2;
  uint64 memory_limit_bytes = 3;
}

// The scheduler must reserve node capacity before sending this request. A
// transport failure is an uncertain outcome: retain reservation until Stats
// reconciles it. Matching target retries are idempotent within an incarnation.
// The operation_id binds the full request fingerprint (identity, revision,
// numbers, deadline, type); the same ID replays only its recorded outcome and
// a different fingerprint under the same ID is rejected. expected_revision
// must equal the incarnation's current resource revision; a request without a
// proven revision is rejected instead of silently skipping the compare.
message ResizeResourcesRequest {
  string sandbox_id = 1;
  string resource_generation = 2;
  ResourceLimits expected = 3;
  ResourceLimits target = 4;
  // Required absolute command expiry, checked again under the resource lock.
  int64 deadline_unix_ms = 5;
  string operation_id = 6;
  uint64 expected_revision = 7;
}

// ShrinkResources carries the same field contract as ResizeResources. It is a
// separate operation type in the fingerprint and on the wire: memory may only
// decrease and the CPU numbers must equal the live limits exactly. The
// response reuses ResizeResourcesResponse without changing the independent
// operation semantics.
message ShrinkResourcesRequest {
  string sandbox_id = 1;
  string resource_generation = 2;
  ResourceLimits expected = 3;
  ResourceLimits target = 4;
  // Required absolute command expiry, checked again under the resource lock.
  int64 deadline_unix_ms = 5;
  string operation_id = 6;
  uint64 expected_revision = 7;
}

message ResizeResourcesResponse {
  StatsResponse actual = 1;
  // Complete includes successful soft-limit application and hard-limit readback.
  bool complete = 2;
  // A partial write is returned with actual limits, never disguised as no-op.
  string update_error = 3;
}

// Deletes only the physical incarnation identified by expected_generation.
message DeleteIfGenerationRequest {
  string id = 1;
  string expected_generation = 2;
}
message DeleteIfGenerationResponse {
  string retired_generation = 1;
}

// The complete original request and its RPC kind are immutable. This endpoint
// never applies the target or renews a deadline. A closed outcome is read back;
// an expired unstarted request consumes its revision with unchanged limits.
message ResolveResourceOperationRequest {
  ResizeResourcesRequest original = 1;
  bool shrink = 2;
}

// Ordered coordinates never substitute for the complete operation identity.
message HistoryIdentity {
  string authority = 1;
  string environment_id = 2;
  string runtime_id = 3;
  uint64 assignment_generation = 4;
}
message HistoryProtection {
  string environment_id = 1;
  uint64 assignment_generation = 2;
  string specification_sha256 = 3;
  uint64 minimum_runtime_revision = 4;
  uint64 environment_revision = 5;
}
message HistoryBoundary {
  string authority = 1;
  uint64 coordinator_epoch = 2;
  uint64 assignment_generation = 3;
  uint64 catalog_revision = 4;
  repeated HistoryProtection protected = 5;
}
message HistoryCandidate {
  string operation_id = 1;
  string request_fingerprint = 2;
  uint64 deadline_unix_millis = 3;
  HistoryIdentity identity = 4;
  string sandbox_id = 5;
  string resource_generation = 6;
}
message CollectHistoryRequest {
  HistoryBoundary boundary = 1;
  repeated HistoryCandidate candidates = 2;
}
message CollectHistoryResponse {
  repeated string acknowledged_operation_ids = 1;
  uint64 remaining_start_operations = 2;
  uint64 removed_files = 3;
  uint64 removed_bytes = 4;
}
