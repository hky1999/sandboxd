syntax = "proto3";

package runtime.v1;

option go_package = "github.com/inclusionAI/sandboxd/api/runtime/v1;v1";

// SandboxService manages sandbox lifecycle and inspection operations.
service SandboxService {
  // Start creates and starts a sandbox.
  rpc Start(StartRequest) returns (StartResponse) {}
  // StartWithOperation starts a sandbox under an explicit, persistent
  // operation identity so a client that lost the reply can query or replay the
  // original operation instead of blindly re-creating the sandbox. The
  // operation record is node-local idempotency state; it is not a cross-node
  // writer lease or fencing token. Old servers that predate the RPC return
  // Unimplemented; callers must fail hard instead of falling back to Start.
  rpc StartWithOperation(StartWithOperationRequest) returns (StartOperationStatus) {}
  // GetStartOperation returns the durable state of one start operation. It
  // never creates anything and never re-executes a past operation.
  rpc GetStartOperation(GetStartOperationRequest) returns (StartOperationStatus) {}
  // Checkpoint saves a running sandbox into a caller-owned directory.
  rpc Checkpoint(CheckpointRequest) returns (CheckpointResponse) {}
  // CheckpointIfGeneration checkpoints only the physical incarnation that
  // still carries the expected server-assigned resource generation. Old
  // servers that predate the RPC return Unimplemented; callers must not
  // fall back to the unconditional Checkpoint.
  rpc CheckpointIfGeneration(CheckpointIfGenerationRequest) returns (CheckpointResponse) {}
  // CheckpointWithOperation checkpoints a running sandbox under an explicit,
  // persistent operation identity so a client that lost the reply can query
  // or replay the original checkpoint instead of re-running it against an
  // unproven source state. Only stop-and-copy Firecracker directory
  // checkpoints are supported; the operation record is node-local
  // idempotency state, not a cross-node writer lease or fencing token. Old
  // servers that predate the RPC return Unimplemented; callers must fail
  // hard instead of falling back to Checkpoint or CheckpointIfGeneration.
  // New admissions require a runtime with both the sealed-root writer and
  // the operation-witness capabilities and are recorded under recovery
  // protocol WITNESS; the exact operation binding is sent to the runtime and
  // a successful checkpoint acknowledges the retained evidence after the
  // SUCCEEDED fact is durable.
  rpc CheckpointWithOperation(CheckpointWithOperationRequest) returns (CheckpointOperationStatus) {}
  // GetCheckpointOperation returns the durable state of one checkpoint
  // operation. It never starts a checkpoint and never re-executes a past
  // operation.
  rpc GetCheckpointOperation(GetCheckpointOperationRequest) returns (CheckpointOperationStatus) {}
  // RecoverCheckpointOperation explicitly reconciles one already-recorded
  // checkpoint operation bound to the witness recovery protocol: it completes
  // the runtime's stop-source flow for an undetermined record and releases
  // the evidence-retention gate of a durable success. It never admits a new
  // operation, never takes a snapshot, never resumes the source, and never
  // falls back to Checkpoint, CheckpointIfGeneration, or
  // CheckpointWithOperation. A missing record is NotFound; a legacy
  // protocol-0 record, a FAILED record, and any binding mismatch are
  // refused.
  rpc RecoverCheckpointOperation(RecoverCheckpointOperationRequest) returns (CheckpointOperationStatus) {}
  // Delete force-deletes a sandbox.
  rpc Delete(DeleteRequest) returns (DeleteResponse) {}
  // DeleteIfGeneration retires one physical generation only when the sandbox
  // still carries the expected server-assigned resource generation.
  rpc DeleteIfGeneration(DeleteIfGenerationRequest) returns (DeleteIfGenerationResponse) {}
  // Wait waits for a sandbox to exit.
  rpc Wait(WaitRequest) returns (WaitResponse) {}
  // List lists sandboxes by filters.
  rpc List(ListSandboxesRequest) returns (ListSandboxesResponse) {}
  // Stats returns resource usage statistics for a sandbox.
  rpc Stats(StatsRequest) returns (StatsResponse) {}
  // ListAvailableRuntimes lists runtime classes whose handlers are ready.
  rpc ListAvailableRuntimes(ListAvailableRuntimesRequest) returns (ListAvailableRuntimesResponse) {}
  // SetNetworkPolicy atomically replaces the network policy of a running sandbox.
  rpc SetNetworkPolicy(SetNetworkPolicyRequest) returns (SetNetworkPolicyResponse) {}
}

// NetworkPolicyAction is the action selected by a network policy rule.
enum NetworkPolicyAction {
  NETWORK_POLICY_ACTION_UNSPECIFIED = 0;
  NETWORK_POLICY_ACTION_ALLOW       = 1;
  NETWORK_POLICY_ACTION_DENY        = 2;
}

// NetworkDirection is expressed from the sandbox's point of view.
enum NetworkDirection {
  NETWORK_DIRECTION_UNSPECIFIED = 0;
  NETWORK_DIRECTION_INGRESS     = 1;
  NETWORK_DIRECTION_EGRESS      = 2;
  NETWORK_DIRECTION_BOTH        = 3;
}

// NetworkProtocol selects the IPv4 transport protocol matched by a rule.
enum NetworkProtocol {
  NETWORK_PROTOCOL_UNSPECIFIED = 0;
  NETWORK_PROTOCOL_ANY         = 1;
  NETWORK_PROTOCOL_TCP         = 2;
  NETWORK_PROTOCOL_UDP         = 3;
  NETWORK_PROTOCOL_ICMP        = 4;
}

// TrafficPolicyMode selects whether replies are evaluated independently or
// are admitted from connection state created by an allowed new flow.
enum TrafficPolicyMode {
  TRAFFIC_POLICY_MODE_UNSPECIFIED = 0;
  TRAFFIC_POLICY_MODE_STATELESS   = 1;
  TRAFFIC_POLICY_MODE_STATEFUL    = 2;
}

// NetworkEndpoint identifies the remote peer matched by a traffic rule.
message NetworkEndpoint {
  // Address is an exact IPv4 address in v1.
  string address = 1;
  // Port is an exact TCP or UDP port. Zero matches any port.
  uint32 port = 2;
  // Cidr is an IPv4 address or CIDR prefix in network policy schema v2.
  string cidr = 3;
  // Domain is an exact DNS name or a leading "*." suffix pattern in schema
  // v2. Domain peers are valid only for egress rules.
  string domain = 4;
  // PortRange selects a contiguous remote TCP or UDP port range in schema v2.
  PortRange port_range = 5;
}

// PortRange is an inclusive TCP or UDP port interval.
message PortRange {
  uint32 first = 1;
  uint32 last  = 2;
}

// TrafficRule describes one ingress or egress packet rule.
message TrafficRule {
  NetworkPolicyAction action = 1;
  NetworkDirection direction = 2;
  NetworkProtocol protocol   = 3;
  NetworkEndpoint peer       = 4;
  // SandboxPort is the destination port on ingress and source port on
  // egress. Zero matches any sandbox port. An omitted peer matches any
  // remote address and port.
  uint32 sandbox_port = 5;
  // SandboxPortRange selects an inclusive local port interval in schema v2.
  PortRange sandbox_port_range = 6;
  // Priority orders schema v2 rules. Higher values win and DENY wins a tie.
  // Zero selects the default user priority of 100.
  uint32 priority = 7;
}

// TrafficPolicy controls IPv4 packets crossing a sandbox's host endpoint.
message TrafficPolicy {
  // DefaultAction is the shared ingress and egress default in schema v1.
  NetworkPolicyAction default_action = 1;
  repeated TrafficRule rules         = 2;
  TrafficPolicyMode mode             = 3;
  // IngressDefaultAction and EgressDefaultAction are required by schema v2.
  NetworkPolicyAction ingress_default_action = 4;
  NetworkPolicyAction egress_default_action  = 5;
}

// DNSRule matches either an exact DNS name or a leading "*." suffix pattern.
message DNSRule {
  NetworkPolicyAction action = 1;
  string pattern             = 2;
}

// DNSPolicy controls conventional DNS queries sent through sandboxd's proxy.
message DNSPolicy {
  NetworkPolicyAction default_action = 1;
  repeated DNSRule rules             = 2;
}

// NetworkPolicy combines packet and DNS policy. Missing sections allow traffic.
message NetworkPolicy {
  TrafficPolicy traffic = 1;
  DNSPolicy dns         = 2;
  // SchemaVersion is omitted for the legacy exact-address schema. Version 2
  // enables CIDRs, domain peers, port ranges, priorities, and independent
  // ingress and egress defaults.
  uint32 schema_version = 3;
}

// SetNetworkPolicyRequest replaces a running sandbox's complete policy.
message SetNetworkPolicyRequest {
  string sandbox_id            = 1;
  NetworkPolicy network_policy = 2;
}

// SetNetworkPolicyResponse is empty after a successful replacement.
message SetNetworkPolicyResponse {}

// RootfsSrcType identifies the root filesystem source type.
enum RootfsSrcType {
  S3    = 0;
  IMAGE = 1;
  LOCAL = 2;
}

// S3Config describes an S3 object source.
message S3Config {
  string endpoint          = 1;
  string bucket            = 2;
  string object            = 3;
  string access_key_id     = 4;
  string access_key_secret = 5;
}

// RootfsConfig describes the sandbox root filesystem source.
message RootfsConfig {
  // Readonly makes the root filesystem read-only when true.
  bool readonly = 1;
  // Type identifies the root filesystem source type.
  RootfsSrcType type = 2;
  oneof source {
    // ImageURL is the image URL used as the root filesystem source.
    string image_url = 3;
    // S3Config is the S3 object used as the root filesystem source.
    S3Config s3_config = 4;
    // Path is a local directory or file used as the root filesystem source.
    string path = 5;
  }
  // WritableLayerSizeBytes is a compatibility alias used by existing
  // Function Proxy clients. sandboxd normalizes it to the start request's
  // writable_layer_limit_bytes field.
  uint64 writable_layer_size_bytes = 6;
}

// Mount describes an additional mount attached to the sandbox.
message Mount {
  // Type identifies the mount type, such as bind, volume, or tmpfs.
  string type = 1;
  // Target is the mount target path inside the sandbox.
  string target = 2;
  // Options contains zero or more fstab-style mount options.
  repeated string options = 3;
  oneof source {
    // HostPath is a host path for bind mounts or a volume name.
    string host_path = 10;
    // S3Config is the S3 object used as the mount source.
    S3Config s3_config = 11;
    // ImageURL is the OCI image URL used as the mount source.
    string image_url = 12;
  }
}

// XpuAllocation describes concrete accelerator devices assigned by the
// scheduler on the selected node.
message XpuAllocation {
  // Type is the normalized accelerator type, such as gpu.
  string type = 1;
  // DeviceIDs contains node-local physical device IDs selected by the scheduler.
  repeated uint32 device_ids = 2;
}

// CheckpointInfo selects checkpoint restore mode for Start.
message CheckpointInfo {
  // CheckpointDir is the caller-owned directory containing runtime artifacts.
  string checkpoint_dir = 1;
}

// StartRequest describes a sandbox start request.
message StartRequest {
  // SandboxID is an optional caller-provided sandbox ID. sandboxd generates one when empty.
  string sandbox_id = 1;
  // TemplateID is reserved for API compatibility with downstream builds that
  // can start from pre-registered sandbox templates. The open-source runtime
  // path does not implement template reuse and ignores this field.
  string template_id = 2;
  // Runtime is the runtime handler name, such as runsc.
  string runtime = 3;
  // Rootfs is the root filesystem source used by the sandbox.
  RootfsConfig rootfs = 4;
  // Command is the executable and arguments to run inside the sandbox.
  repeated string command = 5;
  // Cwd is the working directory inside the sandbox.
  string cwd = 6;
  // Envs contains environment variables for the sandbox process.
  map<string, string> envs = 7;
  // Mounts contains additional mounts attached to the sandbox.
  repeated Mount mounts = 8;
  // Resources contains sandbox resource requests. CPU is millicores and memory is MB.
  map<string, double> resources = 9;
  // Stdout is the redirect path for stdout. Empty means stdout is discarded to /dev/null.
  string stdout = 10;
  // Stderr is the redirect path for stderr. Empty means stderr is discarded to /dev/null.
  string stderr = 11;
  // ExtraConfig is a JSON string for runtime-specific configuration.
  string extra_config = 12;
  // Network is reserved for network-mode selection. The current runsc adapter
  // always uses sandbox networking with netstack.
  string network = 13;
  // TraceID is an optional distributed trace ID.
  string trace_id = 14;
  // Ports contains port forwarding entries in "protocol:dstPort:targetPort" format.
  repeated string ports = 15;
  // Labels contains sandbox labels used for selection and runtime metadata.
  map<string, string> labels = 16;
  // MetricLabels contains sandbox metadata intended for metric dimensions.
  map<string, string> metric_labels = 17;
  // XpuAllocations contains concrete accelerator devices assigned to the sandbox.
  repeated XpuAllocation xpu_allocations = 18;
  // WritableLayerLimitBytes is the hard quota for the writable root filesystem
  // layer. Zero preserves the node-configured default for older clients.
  uint64 writable_layer_limit_bytes = 19;
  // NetworkPolicy is the sandbox's initial packet and DNS policy. It can be
  // replaced while the sandbox is running with SetNetworkPolicy.
  NetworkPolicy network_policy = 20;
  // CheckpointInfo restores the new sandbox from caller-owned runtime artifacts.
  CheckpointInfo checkpoint_info = 21;
  // InjectEntrypoint is the absolute in-sandbox path where sandboxd injects
  // the effective Entrypoint/Cmd configuration from an OCI or Nydus image
  // rootfs. Empty disables injection. It does not replace the sandbox's own
  // command.
  string inject_entrypoint = 22;
}

// StartResponse is returned after sandbox start.
message StartResponse {
  // Code is 0 on success.
  int32 code = 1;
  // Message contains details about the start result.
  string message = 2;
  // ID is the unique sandbox ID.
  string id = 3;
  // Field 4 stays unused so this field keeps the scheduler-compatible number.
  // Physical incarnation assigned by the daemon when this sandbox was created.
  // A caller-supplied label with the reserved generation key cannot choose or
  // reuse this value.
  string resource_generation = 5;
}

// RestoreArtifactIdentity binds a restore start to checkpoint content, not
// merely its directory path. New admissions verify the caller's expected root
// against the sealed manifest and validated sidecar semantics. Replays resolve
// the persisted operation record without re-reading retired artifact files.
message RestoreArtifactIdentity {
  // CheckpointDir is the caller-owned directory holding the runtime artifacts.
  // It must equal start.checkpoint_info.checkpoint_dir exactly.
  string checkpoint_dir = 1;
  // ExpectedRootDigest is required for identified restore operations. It is
  // the hex-encoded SHA-256 content root derived by pkg/checkpointroot from
  // the sealed manifest and validated sidecar identities, not the hash of
  // manifest.json alone. Admission and supported runtime restore both verify
  // this pin; artifacts lacking a verifiable content root are rejected.
  string expected_root_digest = 2;
}

// StartWithOperationRequest wraps one StartRequest with a persistent operation
// identity. The legacy Start wire format and semantics are unchanged; this
// wrapper adds only the operation binding.
message StartWithOperationRequest {
  // OperationID is the stable caller-chosen identifier of this start
  // operation. It is the durable idempotency key: the daemon records it before
  // any side effect, and a replay with the same ID returns the recorded
  // outcome instead of creating again. Once a terminal outcome is recorded the
  // ID is never re-executed, even after the sandbox is deleted.
  string operation_id = 1;
  // SandboxID is the explicit sandbox ID this operation creates. It is
  // required: an operation must name the identity it intends to create so the
  // durable binding survives reply loss. It must equal start.sandbox_id when
  // that field is set.
  string sandbox_id = 2;
  // Start is the wrapped legacy start request. The daemon normalizes it the
  // same way Start does and computes a deterministic digest for replay
  // comparison; only explicitly non-semantic fields (trace ID and the reserved
  // daemon-owned generation label) are excluded. Any other difference refuses
  // reuse of the operation ID.
  StartRequest start = 3;
  // RestoreArtifacts is required exactly when start.checkpoint_info is set and
  // carries the artifact identity binding for the restore.
  RestoreArtifactIdentity restore_artifacts = 4;
}

// StartOperationState is the durable lifecycle state of a start operation.
enum StartOperationState {
  // UNSPECIFIED is never returned by a healthy daemon.
  START_OPERATION_STATE_UNSPECIFIED = 0;
  // RUNNING means the operation was admitted and its outcome is still pending.
  START_OPERATION_STATE_RUNNING = 1;
  // SUCCEEDED means a durable success fact exists for the operation. It is a
  // historical fact: it reports the generation the operation created and does
  // not claim the sandbox still exists or still runs.
  START_OPERATION_STATE_SUCCEEDED = 2;
  // FAILED means the start was fully rolled back with a proven cleanup. The
  // operation ID is spent; creating under the same sandbox ID requires a new
  // operation ID.
  START_OPERATION_STATE_FAILED = 3;
  // UNKNOWN means the outcome could not be proven from durable evidence. The
  // operation ID is spent and re-execution is forbidden; reconcile the
  // protected ID before issuing a new operation for it.
  START_OPERATION_STATE_UNKNOWN = 4;
}

// StartOperationStatus is the durable state of one start operation, returned by
// both StartWithOperation and GetStartOperation.
message StartOperationStatus {
  // OperationID repeats the queried operation ID.
  string operation_id = 1;
  // SandboxID is the sandbox the operation is bound to.
  string sandbox_id = 2;
  // State is the durable lifecycle state of the operation.
  StartOperationState state = 3;
  // ResourceGeneration is the daemon-assigned physical incarnation generation
  // the operation created (or, while RUNNING, the one it will use). A caller
  // label can never choose this value.
  string resource_generation = 4;
  // Message carries the outcome detail, including why an UNKNOWN outcome could
  // not be proven.
  string message = 5;
}

// GetStartOperationRequest queries one start operation by identity.
message GetStartOperationRequest {
  // OperationID is the operation identity to look up.
  string operation_id = 1;
}

// CheckpointRequest describes a synchronous checkpoint operation.
message CheckpointRequest {
  // ID is the source sandbox ID.
  string id = 1;
  // CheckpointDir is an absolute caller-owned output directory.
  string checkpoint_dir = 2;
  // TimeoutSeconds bounds the complete checkpoint operation and must be non-zero.
  uint32 timeout_seconds = 3;
  // Compress enables runtime-supported checkpoint compression.
  bool compress = 4;
  // LeaveRunning keeps the source sandbox running after a successful checkpoint.
  bool leave_running = 5;
  // SnapshotType requests a specific checkpoint flavor: Full, Incremental,
  // or SoftDirty. Empty (the default) leaves the automatic tier selection to
  // the runtime. Firecracker maps the values onto its snapshot types;
  // runtimes without incremental checkpoints ignore the field.
  string snapshot_type = 6;
}

// CheckpointResponse is empty after the checkpoint artifact is complete.
message CheckpointResponse {}

// CheckpointIfGenerationRequest checkpoints one exact physical incarnation.
message CheckpointIfGenerationRequest {
  // Checkpoint is the checkpoint command for the source sandbox.
  CheckpointRequest checkpoint = 1;
  // ExpectedGeneration is the resource_generation returned by Start for the
  // incarnation the caller intends to checkpoint. It is compared as an exact
  // string against the sandbox's current generation label, without trimming.
  string expected_generation = 2;
}

// CheckpointWithOperationRequest wraps one CheckpointRequest with a persistent
// operation identity. Only stop-and-copy Firecracker directory checkpoints are
// admitted: leave_running must be false and the source runtime must be
// Firecracker. The legacy Checkpoint and CheckpointIfGeneration semantics are
// unchanged; this wrapper adds only the operation binding.
message CheckpointWithOperationRequest {
  // OperationID is the stable caller-chosen identifier of this checkpoint
  // operation. It is the durable idempotency key: the daemon records it before
  // any checkpoint side effect, and a replay with the same ID returns the
  // recorded outcome instead of checkpointing again. Once a terminal outcome is
  // recorded the ID is never re-executed, even after the source sandbox is
  // deleted.
  string operation_id = 1;
  // Checkpoint is the wrapped checkpoint command. Every field is semantic and
  // covered by the request digest bound to the operation ID; a replay with any
  // field changed — directory, timeout, compression, leave_running, or
  // snapshot type — refuses the reuse.
  CheckpointRequest checkpoint = 2;
  // ExpectedGeneration is required and binds the operation to the exact
  // physical source incarnation, exactly as in CheckpointIfGeneration. The
  // authoritative comparison still happens inside the checkpoint path under
  // the per-ID physical lock; this field is not a substitute for it.
  string expected_generation = 3;
}

// CheckpointOperationState is the durable lifecycle state of a checkpoint
// operation.
enum CheckpointOperationState {
  // UNSPECIFIED is never returned by a healthy daemon.
  CHECKPOINT_OPERATION_STATE_UNSPECIFIED = 0;
  // RUNNING means the operation was admitted and its outcome is still pending.
  CHECKPOINT_OPERATION_STATE_RUNNING = 1;
  // SUCCEEDED means the checkpoint flow returned success, the sealed content
  // root of the output directory was read, and that fact was made durable. It
  // is a historical fact about the checkpoint completion: it does not claim
  // the artifacts still exist unchanged, nor that the source is still absent
  // or still running.
  CHECKPOINT_OPERATION_STATE_SUCCEEDED = 2;
  // FAILED means the checkpoint was refused or failed before the runtime
  // checkpoint was entered, so no artifact can exist. The operation ID is
  // spent; checkpointing again requires a new operation ID.
  CHECKPOINT_OPERATION_STATE_FAILED = 3;
  // UNKNOWN means the outcome could not be proven from durable evidence — the
  // runtime was entered and then failed, timed out, or was cancelled, the
  // daemon restarted with the operation in flight, or the terminal fact could
  // not be persisted. The operation ID is spent and re-execution is forbidden;
  // reconcile the source and the retained output directory before issuing a
  // new operation.
  CHECKPOINT_OPERATION_STATE_UNKNOWN = 4;
}

// CheckpointOperationRecoveryProtocol reports which recovery protocol the
// durable record was admitted under. It is a record property, never a piece
// of evidence: comparing two historical completion facts must not report a
// conflict because these protocol fields differ.
enum CheckpointOperationRecoveryProtocol {
  // UNSPECIFIED marks a legacy version-1 record. It was admitted before the
  // runtime recorded prepared/completed operation witnesses, so its UNKNOWN
  // outcomes cannot be proven recoverable and explicit recovery is refused;
  // historical Get and same-request replay keep working unchanged.
  CHECKPOINT_OPERATION_RECOVERY_PROTOCOL_UNSPECIFIED = 0;
  // WITNESS marks a version-2 record: the admission verified the runtime
  // supports both the sealed-root writer capability and the operation
  // witness, and the exact operation binding was sent to the runtime. These
  // records — and only these — are eligible for RecoverCheckpointOperation.
  CHECKPOINT_OPERATION_RECOVERY_PROTOCOL_WITNESS = 1;
}

// CheckpointOperationStatus is the durable state of one checkpoint operation,
// returned by both CheckpointWithOperation and GetCheckpointOperation.
message CheckpointOperationStatus {
  // OperationID repeats the queried operation ID.
  string operation_id = 1;
  // SandboxID is the source sandbox the operation is bound to.
  string sandbox_id = 2;
  // State is the durable lifecycle state of the operation.
  CheckpointOperationState state = 3;
  // SourceGeneration is the caller-expected physical incarnation generation
  // the operation was bound to at admission.
  string source_generation = 4;
  // CheckpointDir is the canonical output directory the operation writes to.
  string checkpoint_dir = 5;
  // RequestDigest is the hex SHA-256 of the deterministic encoding of the
  // bound request, exposing exactly which intent the ID answers for.
  string request_digest = 6;
  // ArtifactRootDigest is the content root of the output directory, read from
  // the sealed manifest after the checkpoint completed. It is set only for
  // SUCCEEDED and is a completion-time fact: it does not attest that the
  // directory still holds that content.
  string artifact_root_digest = 7;
  // ArtifactRootScheme names the content-root composition scheme behind
  // ArtifactRootDigest.
  string artifact_root_scheme = 8;
  // Message carries the outcome detail, including why an UNKNOWN outcome could
  // not be proven.
  string message = 9;
  // RecoveryProtocol reports which recovery protocol the durable record was
  // admitted under (see CheckpointOperationRecoveryProtocol). It is set by
  // every reply — query, replay, and recovery alike — from the record alone.
  CheckpointOperationRecoveryProtocol recovery_protocol = 10;
  // EvidenceReleased reports that THIS invocation completed the runtime
  // acknowledgment that releases the operation's evidence-retention gate,
  // after the service's SUCCEEDED fact was already durable. It is per-call,
  // not a durable record field: read-only Get and historical replays report
  // false without proving anything about a past or lost acknowledgment, so it
  // must never be compared as a historical fact. A controller that requires
  // released evidence performs one explicit recovery and reads it there.
  bool evidence_released = 11;
}

// GetCheckpointOperationRequest queries one checkpoint operation by identity.
message GetCheckpointOperationRequest {
  // OperationID is the operation identity to look up.
  string operation_id = 1;
}

// RecoverCheckpointOperationRequest asks for the explicit recovery of one
// already-recorded checkpoint operation. The recovery is authorized by the
// original request alone: the service recomputes the request digest from this
// complete, unrewritten payload and refuses the operation ID when it does not
// match the recorded binding. A caller-echoed digest would prove nothing and
// is deliberately not part of the message.
message RecoverCheckpointOperationRequest {
  // Operation is the complete original CheckpointWithOperationRequest, exactly
  // as it was first admitted — same checkpoint directory spelling, same
  // original checkpoint timeout, compression, leave_running, snapshot type,
  // and the exact expected generation. Rewriting any field changes the request
  // digest and refuses the recovery; the original request timeout keeps its
  // role in the digest and is never replaced by the recovery timeout below.
  CheckpointWithOperationRequest operation = 1;
  // RecoveryTimeoutSeconds bounds this reconciliation attempt — the join of a
  // still-running original executor, the runtime recovery, and the
  // acknowledgment — and must be between 1 and 600. It is not part of the
  // request digest and never rewrites the recorded operation.
  uint32 recovery_timeout_seconds = 2;
}

// DeleteRequest describes a force-delete request.
message DeleteRequest {
  // ID is the sandbox ID.
  string id = 1;
  // Timeout is reserved for graceful deletion. v0.1.0 ignores it and always
  // force-deletes the sandbox.
  int64 timeout = 2;
}

// DeleteResponse is returned after sandbox delete.
message DeleteResponse {}

// DeleteIfGenerationRequest retires exactly one physical incarnation.
message DeleteIfGenerationRequest {
  // ID is the sandbox ID.
  string id = 1;
  // ExpectedGeneration is the resource_generation returned by Start for the
  // incarnation the caller intends to retire.
  string expected_generation = 2;
}

// DeleteIfGenerationResponse confirms the retired incarnation.
message DeleteIfGenerationResponse {
  // RetiredGeneration repeats the retired expected_generation.
  string retired_generation = 1;
}

// WaitRequest describes a sandbox wait request.
message WaitRequest {
  // ID is the sandbox ID.
  string id = 1;
}

// WaitResponse is returned after waiting for a sandbox.
message WaitResponse {
  // Status is reserved and is 0 for a successful Wait response in v0.1.0.
  int32 status = 1;
  // ExitCode is the sandbox process exit code.
  int32 exit_code = 2;
  // Message contains details about the sandbox state.
  string message = 3;
}

// ListSandboxesRequest describes a sandbox list request.
message ListSandboxesRequest {
  // ID filters by sandbox ID when set.
  string id = 1;
  // Selector filters sandboxes by labels. Empty selector lists all sandboxes.
  map<string, string> selector = 10;
}

// ListSandboxesResponse contains sandbox list results.
message ListSandboxesResponse {
  // Sandboxes contains matching sandbox statuses.
  repeated SandboxStatus sandboxes = 1;
}

// SandboxState is the persisted lifecycle state of a sandbox.
enum SandboxState {
  SANDBOX_STATE_RUNNING = 0;
  SANDBOX_STATE_EXITED  = 1;
  SANDBOX_STATE_UNKNOWN = 2;
}

// SandboxStatus describes the current status and metadata of a sandbox.
message SandboxStatus {
  // ID is the sandbox ID.
  string id = 1;
  // Command is the executable and arguments configured for the sandbox.
  repeated string command = 2;
  // Runtime is the runtime handler name.
  string runtime = 3;
  // State is the current sandbox lifecycle state.
  SandboxState state = 4;
  // StartedAt is the sandbox start timestamp in Unix seconds.
  int64 started_at = 5;
  // FinishedAt is the sandbox finish timestamp in Unix seconds.
  int64 finished_at = 6;
  // ExitCode is the sandbox process exit code when available.
  int32 exit_code = 7;
  // Message contains details about the sandbox state.
  string message = 8;
  // Labels contains sandbox labels.
  map<string, string> labels = 9;
  // Mounts contains additional mounts attached to the sandbox.
  repeated Mount mounts = 10;
  // Envs contains environment variables configured for the sandbox.
  repeated KeyValue envs = 11;
  // Stdout is the configured stdout redirect path.
  string stdout = 12;
  // Stderr is the configured stderr redirect path.
  string stderr = 13;
  // Resources contains Linux resource settings for the sandbox.
  LinuxSandboxResources resources = 14;
  // MetricLabels contains sandbox metadata intended for metric dimensions.
  map<string, string> metric_labels = 15;
}

// KeyValue represents a string key-value pair.
message KeyValue {
  // Key is the entry key.
  string key   = 1;
  // Value is the entry value.
  string value = 2;
}

// LinuxSandboxResources describes Linux resource settings for a sandbox.
message LinuxSandboxResources {
  // CPUPeriod is the CPU CFS period in microseconds.
  uint64 cpu_period = 1;
  // CPUQuota is the CPU CFS quota in microseconds.
  int64 cpu_quota = 2;
  // CPUShares is the relative CPU share weight.
  uint64 cpu_shares = 3;
  // MemoryLimitInBytes is the memory limit in bytes.
  int64 memory_limit_in_bytes = 4;
  // OomScoreAdj is the OOM score adjustment.
  int64 oom_score_adj = 5;
  // CpusetCpus is the allowed CPU set.
  string cpuset_cpus = 6;
  // CpusetMems is the allowed memory node set.
  string cpuset_mems = 7;
  // HugepageLimits contains hugepage limits by page size.
  repeated HugepageLimit hugepage_limits = 8;
  // Unified contains cgroup v2 unified controller settings.
  map<string, string> unified = 9;
  // MemorySwapLimitInBytes is the memory plus swap limit in bytes.
  int64 memory_swap_limit_in_bytes = 10;
}

// HugepageLimit describes a hugepage limit for one page size.
message HugepageLimit {
  // PageSize is the hugepage size.
  string page_size = 1;
  // Limit is the hugepage limit in bytes.
  uint64 limit = 2;
}

// SandboxMetadata contains the persisted metadata for a sandbox.
message SandboxMetadata {
  // ID is the sandbox ID.
  string id = 1;
  // RuntimeHandler is the runtime handler name.
  string runtime_handler = 3;
  // Labels contains sandbox labels.
  map<string, string> labels = 4;
  // Stdout is the configured stdout redirect path.
  string stdout = 6;
  // Stderr is the configured stderr redirect path.
  string stderr = 7;
  // MetricLabels contains sandbox metadata intended for metric dimensions.
  map<string, string> metric_labels = 8;
}

// SandboxMetadataList contains persisted sandbox metadata entries.
message SandboxMetadataList {
  // Sandboxes maps sandbox ID to sandbox metadata.
  map<string, SandboxMetadata> sandboxes = 1;
}

// StatsRequest describes a sandbox stats request.
message StatsRequest {
  // ID is the sandbox ID.
  string id = 1;
}

// StatsResponse contains sandbox resource usage statistics.
message StatsResponse {
  // Total CPU usage in nanoseconds.
  uint64 cpu_usage_ns = 1;
  // Current memory usage in bytes.
  uint64 memory_usage_bytes = 2;
  // Memory limit in bytes.
  uint64 memory_limit_bytes = 3;
  // Maximum memory usage observed in bytes.
  uint64 memory_max_usage_bytes = 4;
  // CPU usage in kernel mode in nanoseconds.
  uint64 cpu_kernel_ns = 5;
  // CPU usage in user mode in nanoseconds.
  uint64 cpu_user_ns = 6;
}

// ListAvailableRuntimesRequest requests the runtime classes currently available
// for new sandbox creation.
message ListAvailableRuntimesRequest {}

// RuntimeInfo describes one initialized runtime handler and its optional
// checkpoint/restore application handoff interface.
message RuntimeInfo {
  // RuntimeClass is the handler name accepted by sandbox start requests.
  string runtime_class = 1;
  // SupportsCheckpointRestore reports whether the handler implements both operations.
  bool supports_checkpoint_restore = 2;
  // CheckpointHandoffPath is the guest-visible resume/restore/error endpoint.
  string checkpoint_handoff_path = 3;
  // RestoreEnvPath exposes the target OCI process environment after restore.
  string restore_env_path = 4;
}

// ListAvailableRuntimesResponse contains the available runtime class snapshot.
message ListAvailableRuntimesResponse {
  // RuntimeClasses contains the sorted handler names accepted by sandbox start requests.
  // Configured runtime classes whose handlers failed to initialize are excluded.
  repeated string runtime_classes = 1;
  // Runtimes contains detailed capabilities in runtime_classes order.
  repeated RuntimeInfo runtimes = 2;
}
